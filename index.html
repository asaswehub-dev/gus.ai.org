<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131c">
  <meta name="description" content="Skippy AI chat with local model loading and a built-in API key generator.">
  <title>Skippy — AI Chat</title>
  <style>
    :root{color-scheme:dark;--bg:#10131c;--panel:#181e2b;--panel-2:#202737;--line:#30394a;--ink:#f2f5fb;--muted:#a3aec0;--accent:#a9f05a;--accent-ink:#17200c;--user:#293347;--danger:#ff8c82;--shadow:rgba(0,0,0,.25)}
    *{box-sizing:border-box}html,body{margin:0;height:100%}body{background:radial-gradient(ellipse at 50% -20%,#29354b 0,transparent 55%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.app{min-height:100vh;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#dbff95);color:var(--accent-ink);font-weight:800;font-size:1.2rem}.brand h1{margin:0;font-size:1.2rem}.brand p{margin:2px 0 0;color:var(--muted);font-size:.82rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:9px 12px;border-radius:10px;font:inherit;cursor:pointer}.button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}.button.ghost{background:transparent}.button:disabled{opacity:.45;cursor:not-allowed}.setup{padding:20px;border-bottom:1px solid var(--line)}.setup-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.setup-title{font-size:1.05rem;font-weight:700}.setup-note{margin:6px 0 0;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:18px;align-items:end}.select-wrap{display:flex;flex-direction:column;gap:8px}.label{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}select,input[type="text"],input[type="password"]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:inherit}.model{min-width:0}.status-box{margin-top:14px}.progress{height:8px;width:100%;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#d6ff99);transition:width .2s ease}.status{min-height:24px;margin-top:8px;color:var(--muted);font-size:.9rem}.status.ready{color:var(--accent)}.status.error{color:var(--danger)}.key-box{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}.key-row{display:flex;gap:8px;align-items:center}.key-row input{flex:1}.main{flex:1;padding:18px 20px 12px;display:flex;flex-direction:column;gap:14px}.chat{display:flex;flex-direction:column;gap:12px;min-height:220px}.message{display:flex;gap:10px;align-items:flex-start}.message.user{justify-content:flex-end}.mini{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;color:#fff;background:#4d5d7a}.message.user .mini{background:#6a7dc5}.bubble{max-width:min(78ch,80%);padding:10px 12px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;line-height:1.5}.message.user .bubble{background:var(--user);border-color:transparent}.message.typing .bubble{color:var(--muted)}.welcome{padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0));display:grid;place-items:center;text-align:center;min-height:170px}.big{font-size:3rem;line-height:1}.welcome h2{margin:8px 0 8px;font-size:1.5rem}.welcome p{margin:0;color:var(--muted)}.suggestions{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.suggestions button{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);text-align:left;cursor:pointer}.suggestions button b{display:block;margin-bottom:2px}.suggestions button span{color:var(--muted);font-size:.8rem}.composer{display:flex;align-items:flex-end;gap:10px;padding:0 20px 20px}.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:14px;padding:12px 14px;min-height:52px;max-height:180px;font:inherit}.send{width:52px;height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.5rem;cursor:pointer;font-weight:700}.send.stop{background:var(--danger);color:#fff}.image-view{display:none;padding:0;border-top:1px solid var(--line)}.image-view[hidden]{display:none}.image-view iframe{width:100%;height:calc(100vh - 84px);border:0;background:#0a1017}.@media(max-width:720px){.header{padding:14px 14px 10px}.setup,.main,.composer{padding-left:14px;padding-right:14px}.controls{grid-template-columns:1fr}.key-row{flex-direction:column;align-items:stretch}.suggestions{grid-template-columns:1fr}} 
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="avatar" aria-hidden="true">S</div>
        <div>
          <h1>Skippy</h1>
          <p>Local AI, fast and light</p>
        </div>
      </div>
      <div class="actions">
        <button class="button" id="mode-toggle" type="button" aria-pressed="false">Image generator</button>
        <button class="button ghost" id="open-key" type="button">API key</button>
      </div>
    </header>

    <div id="chat-view">
      <section class="setup" aria-label="AI model setup">
        <div class="setup-top">
          <div>
            <div class="setup-title">Load a model</div>
            <p class="setup-note">Runs locally in the browser. Nothing fancy required.</p>
          </div>
        </div>

        <div class="controls">
          <div class="select-wrap">
            <label class="label" for="model">Model</label>
            <select class="model" id="model" disabled>
              <option>Loading…</option>
            </select>
          </div>
          <button class="button primary" id="load" type="button" disabled>Load model</button>
        </div>

        <div class="key-box">
          <label class="label" for="api-key">API key</label>
          <div class="key-row">
            <input id="api-key" type="password" placeholder="Paste or generate a key" autocomplete="off">
            <button class="button ghost" id="generate-key" type="button">Generate</button>
          </div>
        </div>

        <div class="status-box">
          <div class="progress" aria-hidden="true"><div class="progress-bar" id="bar"></div></div>
          <div class="status" id="status" role="status" aria-live="polite">Checking browser support…</div>
        </div>
      </section>

      <main class="main">
        <section class="chat" id="chat" aria-live="polite" aria-label="Chat messages"></section>
        <section class="welcome" id="welcome">
          <div>
            <div class="big" aria-hidden="true">⚡</div>
            <h2>Ready when you are.</h2>
            <p>Ask for ideas, code, summaries, or a quick explanation.</p>
            <div class="suggestions">
              <button type="button" data-prompt="Explain black holes like I’m curious but easily bored."><b>Explain something strange</b><span>Make the cosmos almost make sense.</span></button>
              <button type="button" data-prompt="Help me plan a productive day without making it miserable."><b>Plan my day</b><span>Efficiency, with a little less suffering.</span></button>
              <button type="button" data-prompt="Give me three clever weekend project ideas."><b>Brainstorm ideas</b><span>Small but interesting and fun.</span></button>
              <button type="button" data-prompt="Tell me a short joke worth hearing."><b>Entertain me</b><span>Low effort, high comedy.</span></button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <section id="image-view" class="image-view" aria-label="Image generation" hidden>
      <iframe id="image-frame" src="./image-generator.html" title="Skippy image generator" loading="lazy"></iframe>
    </section>

    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Load a model to start chatting…" aria-label="Message Skippy" disabled></textarea>
      <button class="send" id="send" type="submit" aria-label="Send message" disabled>↑</button>
    </form>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const chat = $('chat'), input = $('input'), sendButton = $('send');
    let webllm, engine, busy = false, stopRequested = false, history = [];
    const API_KEY_STORAGE = 'skippy-api-key';
    const SYSTEM = `You are Skippy, a helpful and witty AI sidekick. Keep answers clear, concise, and useful. Be playful when it fits, but focus on practical value.`;

    function setStatus(text, type = '') {
      const node = $('status');
      node.textContent = text;
      node.className = 'status ' + type;
    }

    function addMessage(role, text = '', extra = '') {
      const row = document.createElement('div');
      row.className = `message ${role} ${extra}`.trim();
      const icon = document.createElement('div');
      icon.className = 'mini';
      icon.textContent = role === 'user' ? 'YOU' : 'S';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.append(icon, bubble);
      chat.appendChild(row);
      row.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return bubble;
    }

    function resizeInput() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    }

    function getStoredKey() {
      try {
        return localStorage.getItem(API_KEY_STORAGE) || '';
      } catch {
        return '';
      }
    }

    function saveKey(value) {
      try {
        localStorage.setItem(API_KEY_STORAGE, value);
      } catch {}
    }

    function generateRandomToken() {
      if (!crypto?.getRandomValues) return '';
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      let binary = '';
      bytes.forEach((byte) => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function injectKey(value) {
      const cleaned = (value || '').trim();
      $('api-key').value = cleaned;
      saveKey(cleaned);
    }

    document.querySelectorAll('[data-prompt]').forEach((button) => {
      button.addEventListener('click', () => {
        input.value = button.dataset.prompt;
        resizeInput();
        input.focus();
        if (engine) sendMessage();
      });
    });

    $('mode-toggle').addEventListener('click', () => {
      const showImages = $('image-view').hidden;
      $('image-view').hidden = !showImages;
      $('chat-view').hidden = showImages;
      $('mode-toggle').setAttribute('aria-pressed', String(showImages));
      $('mode-toggle').textContent = showImages ? 'Back to chat' : 'Image generator';
      if (showImages) {
        $('image-frame').contentWindow?.postMessage({ type: 'skippy-image-view' }, location.origin);
      }
    });

    $('open-key').addEventListener('click', () => {
      window.open('./api-key-generator.html', '_blank', 'noopener');
    });

    $('generate-key').addEventListener('click', () => {
      const token = generateRandomToken();
      if (!token) {
        setStatus('Secure random generation is unavailable in this browser.', 'error');
        return;
      }
      injectKey(token);
      setStatus('Generated a local token.', 'ready');
    });

    $('api-key').value = getStoredKey();

    input.addEventListener('input', resizeInput);
    $('form').addEventListener('submit', (event) => {
      event.preventDefault();
      if (busy) {
        stopRequested = true;
        engine?.interruptGenerate();
      } else {
        sendMessage();
      }
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        if (!busy) sendMessage();
      }
    });

    async function loadLibrary() {
      return import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm');
    }

    async function init() {
      if (!navigator.gpu) {
        $('model').innerHTML = '<option>WebGPU unavailable</option>';
        setStatus('This browser does not support WebGPU.', 'error');
        return;
      }

      try {
        webllm = await loadLibrary();
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error('No compatible graphics adapter was found.');
        const precision = adapter.features.has('shader-f16') ? 'q4f16_1' : 'q4f32_1';
        const models = webllm.prebuiltAppConfig.model_list
          .filter((item) => item.model_id.includes(precision))
          .sort((a, b) => (a.vram_required_MB || 0) - (b.vram_required_MB || 0));

        if (!models.length) throw new Error('No compatible models were found for this device.');

        const select = $('model');
        select.replaceChildren();
        models.slice(0, 18).forEach((item) => {
          const option = document.createElement('option');
          option.value = item.model_id;
          const memory = item.vram_required_MB ? ` · ~${(item.vram_required_MB / 1024).toFixed(1)} GB` : '';
          option.textContent = item.model_id + memory;
          select.appendChild(option);
        });

        const recommended = models.find((item) => /Llama-3\.2-1B-Instruct/i.test(item.model_id)) || models.find((item) => /Qwen2\.5-1\.5B-Instruct/i.test(item.model_id)) || models[0];
        select.value = recommended.model_id;
        $('load').disabled = false;
        $('model').disabled = false;
        setStatus('Ready to load a model.', 'ready');
      } catch (error) {
        setStatus(error.message || 'Could not initialize the AI library.', 'error');
      }
    }

    $('load').addEventListener('click', async () => {
      const button = $('load');
      const select = $('model');
      button.disabled = true;
      select.disabled = true;
      setStatus('Starting model download…');

      try {
        engine = await webllm.CreateMLCEngine(select.value, {
          initProgressCallback: (progress) => {
            const percent = Math.round((progress.progress || 0) * 100);
            $('bar').style.width = percent + '%';
            setStatus(progress.text || 'Loading model…');
          },
        });

        $('bar').style.width = '100%';
        input.disabled = false;
        sendButton.disabled = false;
        input.placeholder = 'Message Skippy…';
        setStatus('Skippy is online.', 'ready');
        input.focus();
      } catch (error) {
        engine = null;
        button.disabled = false;
        select.disabled = false;
        setStatus(`Could not load the model: ${error.message || error}.`, 'error');
      }
    });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || !engine || busy) return;

      busy = true;
      stopRequested = false;
      $('welcome').hidden = true;
      input.value = '';
      resizeInput();
      addMessage('user', text);
      const response = addMessage('assistant', 'Thinking…', 'typing');
      history.push({ role: 'user', content: text });

      try {
        const stream = await engine.chat.completions.create({
          messages: [{ role: 'system', content: SYSTEM }, ...history],
          stream: true,
          temperature: 0.75,
          max_tokens: 900,
        });

        let answer = '';
        response.textContent = '';
        for await (const part of stream) {
          if (stopRequested) break;
          answer += part.choices?.[0]?.delta?.content || '';
          response.textContent = answer || '…';
        }

        answer = answer.trim() || (stopRequested ? '(Generation stopped.)' : 'I lost the thread. Try asking again.');
        response.textContent = answer;

        if (!stopRequested) {
          history.push({ role: 'assistant', content: answer });
          if (history.length > 20) history = history.slice(-20);
        }
      } catch (error) {
        response.textContent = `I hit a snag: ${error.message || error}`;
        response.parentElement.classList.add('error');
        history.pop();
      } finally {
        busy = false;
        stopRequested = false;
        sendButton.classList.remove('stop');
        sendButton.textContent = '↑';
        sendButton.setAttribute('aria-label', 'Send message');
        input.focus();
      }
    }

    init();

    const observer = new MutationObserver(() => {
      if (busy) {
        sendButton.classList.add('stop');
        sendButton.textContent = '■';
        sendButton.setAttribute('aria-label', 'Stop generating');
      }
    });

    observer.observe(chat, { childList: true, subtree: true });
  </script>
</body>
</html>
